name: TORSHA BAZAAR — Firestore Emulator Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  firestore-emulator-security-tests:
    name: Run Real Firestore Emulator Security & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21 (required by Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java runtime
        run: java -version

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run unit & static security tests
        id: unit_tests
        run: npm run test:unit

      - name: Run Firestore Security Rules tests against live Firebase Emulator
        id: emulator_tests
        run: npm run test:emulator

      - name: TypeScript & Production Build Verification
        id: build_check
        run: |
          npm run lint
          npm run build

      - name: Publish Security & Release Test Summary
        if: always()
        run: |
          {
            echo "## TORSHA BAZAAR Security & Release Summary"
            echo ""
            echo "| Suite / Check | Status | Notes |"
            echo "| --- | --- | --- |"
            echo "| Unit & Static Security Tests (\`npm run test:unit\`) | ${{ steps.unit_tests.outcome == 'success' && 'PASS' || 'FAIL' }} | 28 automated unit & rule-contract tests |"
            echo "| Live Firestore Emulator Security Tests (\`npm run test:emulator\`) | ${{ steps.emulator_tests.outcome == 'success' && 'PASS' || 'FAIL' }} | 16 real Emulator security suites (isolation, RBAC, locality, races, agreedFare lock, PII) |"
            echo "| TypeScript & Production Build (\`npm run lint && npm run build\`) | ${{ steps.build_check.outcome == 'success' && 'PASS' || 'FAIL' }} | \`tsc --noEmit\`, Vite PWA bundle & Node server build |"
            echo "| Physical Android Device & Closed-App FCM Push | NOT TESTED | Requires physical Android hardware & server-side FCM push sender |"
          } >> "$GITHUB_STEP_SUMMARY"
